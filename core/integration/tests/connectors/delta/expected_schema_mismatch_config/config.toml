# The table_uri and path are overridden by the environment variables of DeltaFixture.
# expected_schema deliberately differs from the columns that DeltaFixture creates:
# "id" has the wrong type, "active" is missing, and "email" does not exist in the table.

type = "sink"
key = "delta"
enabled = true
version = 0
name = "Delta Lake sink"
path = "../../target/debug/libiggy_connector_delta_sink"
verbose = true

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100
consumer_group = "delta_sink_connector"

[plugin_config]
table_uri = "file:///tmp/iggy_delta_table"

[plugin_config.expected_schema]
id = "integer"
name = "string"
count = "integer"
amount = "double"
timestamp = "timestamp_ntz"
email = "string"
